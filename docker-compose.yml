services:
  dashboard:
    container_name: dashboard-app
    image: dashboard:ssr
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        PUBLIC_SUPABASE_URL: ${PUBLIC_SUPABASE_URL}
        PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        PUBLIC_STRIPE_PUBLISHABLE_KEY: ${PUBLIC_STRIPE_PUBLISHABLE_KEY}
        PUBLIC_TURNSTILE_SITE_KEY: ${PUBLIC_TURNSTILE_SITE_KEY:-}
        PUBLIC_GOOGLE_CLIENT_ID: ${PUBLIC_GOOGLE_CLIENT_ID:-}
        # Opcional: sin él el build funciona, pero Sentry no sube source maps
        # y los stack traces de producción llegan minificados.
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4321
      # Vault AppRole auth (secrets se cargan en runtime).
      # Vault corre en un contenedor propio sin puertos publicados al host:
      # solo es alcanzable desde su red Docker (ver networks). El endpoint del
      # CONTENEDOR debe apuntar al nombre DNS de la red (CONTAINER_VAULT_ENDPOINT
      # o el default), distinto del VAULT_ENDPOINT que usa deploy.mjs desde el host.
      VAULT_ENDPOINT: ${CONTAINER_VAULT_ENDPOINT:-http://vault-vaultapp-vm1vxd-vault-1:8200}
      VAULT_ROLE_ID: ${VAULT_ROLE_ID}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID}
      VAULT_ENV: ${VAULT_ENV:-production}
    networks:
      - default
      - vault-net
    ports:
      - '4321:4321'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:4321/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true

networks:
  vault-net:
    name: ${VAULT_NETWORK:-vault-vaultapp-vm1vxd_default}
    external: true
