allowBuilds:
  esbuild: true
  msw: true
  sharp: true
minimumReleaseAgeExclude:
  - astro
  - '@astrojs/markdown-satteri@0.3.2'
onlyBuiltDependencies:
  - esbuild
  - puppeteer
  - sharp
peerDependencyRules:
  allowedVersions:
    astro-pagefind>astro: ">=7"
overrides:
  smol-toml: 1.6.1
  picomatch: 2.3.2
  fast-uri: ">=3.1.2"
  hono: ">=4.12.25"
  ip-address: 10.1.1
  path-to-regexp: 8.4.0
  brace-expansion: ">=5.0.6"
  yaml: 2.8.3
  follow-redirects: 1.16.0
  postcss: 8.5.10
